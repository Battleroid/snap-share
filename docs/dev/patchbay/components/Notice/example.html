<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Notice</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div style="display:grid;gap:12px">
  <div class="pb-notice" role="status"><span class="pb-icon pb-icon--status-info"></span><p class="pb-notice__title">Maintenance tonight</p><p class="pb-notice__body">Pool scrub runs 02:00–06:00. Expect slow file loads.</p></div>
  <div class="pb-notice" data-status="ok" role="status"><span class="pb-icon pb-icon--status-ok"></span><p class="pb-notice__title">Backup finished</p><button class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Dismiss"><span class="pb-icon pb-icon--close"></span></button></div>
  <div class="pb-notice" data-status="warn" role="status"><span class="pb-icon pb-icon--status-warn"></span><p class="pb-notice__title">Certificate expires in 9 days</p><p class="pb-notice__body">Renewal failed twice. DNS challenge timed out.</p><div class="pb-notice__actions"><button class="pb-btn pb-btn--sm">Retry now</button><a class="pb-link" href="#" style="font-size:15px">View log</a></div></div>
  <div class="pb-notice" data-status="down" role="alert"><span class="pb-icon pb-icon--status-down"></span><p class="pb-notice__title">pi-dns is unreachable</p><p class="pb-notice__body">Clients fall back to 1.1.1.1.</p></div>
</div>

</body></html>
