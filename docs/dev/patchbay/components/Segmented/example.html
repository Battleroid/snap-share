<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Segmented</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css"><link rel="stylesheet" href="../../demo.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div class="pb-demo-buttongroup-1">
  <div class="pb-seg" role="radiogroup" aria-label="Window">
    <label><input type="radio" name="win">1h</label><label><input type="radio" name="win" checked>24h</label><label><input type="radio" name="win">7d</label><label><input type="radio" name="win">30d</label></div>
  <div class="pb-seg pb-seg--icon" role="radiogroup" aria-label="View">
    <label title="List"><input type="radio" name="view" checked aria-label="List"><span class="pb-icon pb-icon--menu"></span></label>
    <label title="Topology"><input type="radio" name="view" aria-label="Topology"><span class="pb-icon pb-icon--network"></span></label>
    <label title="Chart"><input type="radio" name="view" aria-label="Chart"><span class="pb-icon pb-icon--activity"></span></label></div>
  <div class="pb-seg pb-seg--sm" aria-label="Show levels">
    <label><input type="checkbox" checked>info</label><label><input type="checkbox" checked>warn</label><label><input type="checkbox" checked>error</label><label><input type="checkbox">debug</label></div>
  <div class="pb-seg pb-seg--block pb-demo-width-100" role="radiogroup" aria-label="Access">
    <label><input type="radio" name="acc" checked><span class="pb-icon pb-icon--lock"></span>Private</label><label><input type="radio" name="acc"><span class="pb-icon pb-icon--link"></span>Link</label><label><input type="radio" name="acc" disabled>Public</label></div>
</div>

</body></html>
