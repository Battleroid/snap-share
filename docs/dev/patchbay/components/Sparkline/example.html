<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Sparkline</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div style="display:grid;gap:24px">
  <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:center">
    <div class="pb-metric"><span class="pb-metric__value">42<small>ms</small></span><span class="pb-metric__side"><svg class="pb-spark" data-spark="1" data-end></svg><span class="pb-stat__delta" data-tone="good">↓ 8 vs 24h</span></span></div>
    <div class="pb-metric"><span class="pb-metric__value">1.9<small>GB/s</small></span><svg class="pb-spark pb-spark--lg pb-spark--ok" data-spark="2" data-area data-end></svg></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:center">
    <div class="pb-metric pb-metric--sm"><span class="pb-eyebrow">cpu</span><span class="pb-metric__value">38<small>%</small></span><svg class="pb-spark pb-spark--sm" data-spark="3"></svg></div>
    <div class="pb-metric pb-metric--sm"><span class="pb-eyebrow">errors</span><span class="pb-metric__value">12</span><svg class="pb-spark pb-spark--sm pb-spark--down" data-bars="4"></svg></div>
    <div class="pb-metric pb-metric--sm"><span class="pb-eyebrow">queue</span><span class="pb-metric__value">3</span><svg class="pb-spark pb-spark--sm pb-spark--warn" data-spark="5" data-base></svg></div>
  </div>
  <div class="pb-metrics">
    <div class="pb-metrics__row"><span><span class="pb-metrics__name">Jellyfin</span><span class="pb-metrics__host">media.lab.home</span></span><svg class="pb-spark" data-spark="6" data-end></svg><span class="pb-metrics__val">84 ms</span><span class="pb-badge" data-status="ok"><span class="pb-icon"></span>up</span></div>
    <div class="pb-metrics__row"><span><span class="pb-metrics__name">Nextcloud</span><span class="pb-metrics__host">cloud.lab.home</span></span><svg class="pb-spark pb-spark--warn" data-spark="7" data-end data-rise></svg><span class="pb-metrics__val">820 ms</span><span class="pb-badge" data-status="warn"><span class="pb-icon"></span>slow</span></div>
    <div class="pb-metrics__row"><span><span class="pb-metrics__name">Postgres</span><span class="pb-metrics__host">db.lab.home</span></span><svg class="pb-spark pb-spark--muted" data-spark="8" data-end></svg><span class="pb-metrics__val">6 ms</span><span class="pb-badge" data-status="ok"><span class="pb-icon"></span>up</span></div>
  </div>
</div>
<script>
/* Patchbay core: escaping, CSP-safe styling, delegated document listeners, placement, and the pbInit() hook registry. */
function pbEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* Markup built as a string carries styles in data-style; pbStyled moves them into the CSSOM, which a strict style-src allows. */
function pbStyled(c){if(!c||!c.querySelectorAll)return c;var l=[].slice.call(c.querySelectorAll('[data-style]'));if(c.hasAttribute&&c.hasAttribute('data-style'))l.unshift(c);
  l.forEach(function(n){n.style.cssText=n.getAttribute('data-style');n.removeAttribute('data-style');});return c;}
/* data-vars="--w:42%;--c:var(--chart-2)" sets custom properties without a style attribute. */
function pbVars(el){(el.getAttribute('data-vars')||'').split(';').forEach(function(d){var i=d.indexOf(':');if(i<0)return;var k=d.slice(0,i).trim(),v=d.slice(i+1).trim();
  if(!/^--[a-z0-9-]+$/.test(k)||!v||/url\(|expression|[;{}<>]/i.test(v))return;el.style.setProperty(k,v);});}
/* One capturing listener per event type on document (window for resize); entries drop out once their element leaves the page. */
var pbDocL={};
function pbOnDoc(type,el,fn){var L=pbDocL[type];
  if(!L){L=pbDocL[type]=new Set();(type==='resize'?window:document).addEventListener(type,function(e){L.forEach(function(x){
    if(!x.el.isConnected){if(x.seen)L.delete(x);return;}x.seen=true;try{x.fn(e);}catch(err){console.error('[patchbay] '+type,err);}});},true);}
  var x={el:el,fn:fn,seen:el.isConnected};L.add(x);return function(){L.delete(x);};}
/* A scrolling box must be reachable by keyboard: focusable, a region, and named. */
function pbScrollRegion(el,name){if(!el)return;if(!el.hasAttribute('tabindex'))el.tabIndex=0;if(!el.hasAttribute('role'))el.setAttribute('role','region');if(!el.hasAttribute('aria-label')&&!el.hasAttribute('aria-labelledby'))el.setAttribute('aria-label',name);}
function pbPlace(trigger,panel,o){o=o||{};var r=o.rect||trigger.getBoundingClientRect(),w=panel.offsetWidth,h=panel.offsetHeight,g=o.gap==null?8:o.gap;
  var below=r.bottom+g+h<=innerHeight||r.top-g-h<0,y=below?r.bottom+g:r.top-g-h,x=o.align==='end'?r.right-w:(o.align==='center'?r.left+r.width/2-w/2:r.left);
  x=Math.max(8,Math.min(x,innerWidth-w-8));panel.style.left=x+'px';panel.style.top=Math.max(8,y)+'px';panel.dataset.side=below?'bottom':'top';
  panel.style.setProperty('--ax',Math.max(10,Math.min(w-20,r.left+r.width/2-x-5))+'px');}
/* pbHook(name, selector, fn) registers a behavior; pbInit(root, {only, skip}) binds every registered hook under root once per element. */
var pbHooks=[],pbBound=new WeakMap();
function pbHook(name,sel,fn){for(var i=0;i<pbHooks.length;i++)if(pbHooks[i].name===name)return;pbHooks.push({name:name,sel:sel,fn:fn});pbInit.hooks.push(name);}
function pbInit(root,opts){root=root||document;opts=opts||{};
  var list=function(v){return v==null?null:(typeof v==='string'?v.split(/[\s,]+/).filter(Boolean):[].slice.call(v));},only=list(opts.only),skip=list(opts.skip)||[];
  pbHooks.forEach(function(h){if(only&&only.indexOf(h.name)<0||skip.indexOf(h.name)>=0)return;
    var els=[].slice.call(root.querySelectorAll(h.sel));if(root.matches&&root.matches(h.sel))els.unshift(root);
    els.forEach(function(el){if(el.closest('[data-pb-skip~="'+h.name+'"]'))return;var s=pbBound.get(el);if(!s){s=new Set();pbBound.set(el,s);}if(s.has(h.name))return;s.add(h.name);
      try{h.fn(el);}catch(err){console.error('[patchbay] '+h.name,err);}});});
  return root;}
pbInit.hooks=[];
function pbSeries(seed,n,base,amp){var o=[];for(var i=0;i<n;i++)o.push(base+amp*Math.sin(i/2.6+seed)+amp*0.45*Math.sin(i*1.9+seed*3));return o;}
function pbPath(d,W,H,pad){var mn=Math.min.apply(0,d),mx=Math.max.apply(0,d),r=mx-mn||1;pad=pad||2;return d.map(function(v,i){return (i?'L':'M')+(i*(W/(d.length-1))).toFixed(1)+' '+(pad+(H-2*pad)*(1-(v-mn)/r)).toFixed(1)}).join(' ');}
/* pbInit() hooks, bound in this order: pbHook(name, selector, behavior). Skip one with data-pb-skip="name" on an ancestor or pbInit(root, {skip:['name']}). */
pbHook('vars','[data-vars]',pbVars);
var NS='http://www.w3.org/2000/svg';
document.querySelectorAll('svg[data-spark],svg[data-bars]').forEach(function(s){var r=s.getBoundingClientRect(),W=r.width,H=r.height;s.setAttribute('viewBox','0 0 '+W+' '+H);
 var seed=+(s.dataset.spark||s.dataset.bars),d=pbSeries(seed,24,50,18);if(s.hasAttribute('data-rise'))d=d.map(function(v,i){return v+i*2.2});var h='';
 if(s.dataset.bars){var bw=W/d.length;var mx=Math.max.apply(0,d);d.forEach(function(v,i){var bh=Math.max(2,(v/mx)*H);h+='<rect x="'+(i*bw+0.5).toFixed(1)+'" y="'+(H-bh).toFixed(1)+'" width="'+(bw-1.5).toFixed(1)+'" height="'+bh.toFixed(1)+'"/>';});}
 else{var p=pbPath(d,W,H,3);if(s.hasAttribute('data-base'))h+='<path class="pb-spark__base" d="M0 '+(H/2)+' H'+W+'"/>';if(s.hasAttribute('data-area'))h+='<path class="pb-spark__area" d="'+p+' L'+W+' '+H+' L0 '+H+'Z"/>';h+='<path d="'+p+'"/>';
  if(s.hasAttribute('data-end')){var last=p.split(' ');h+='<circle cx="'+W+'" cy="'+last[last.length-1]+'" r="2.5"/>';}}
 s.innerHTML=h;});
pbInit();
</script>
</body></html>
