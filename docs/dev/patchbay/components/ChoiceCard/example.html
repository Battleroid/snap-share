<div style="display:grid;gap:20px">
  <fieldset class="pb-choicecards"><legend class="pb-field__label" style="margin-bottom:10px">Storage pool</legend>
    <label class="pb-choicecard"><input type="radio" class="pb-radio" name="pool" checked><span class="pb-icon pb-icon--database pb-icon--24"></span><span class="pb-choicecard__title">tank</span><span class="pb-choicecard__desc">Large, mirrored HDDs.</span><span class="pb-choicecard__meta">1.8 TB free</span></label>
    <label class="pb-choicecard"><input type="radio" class="pb-radio" name="pool"><span class="pb-icon pb-icon--activity pb-icon--24"></span><span class="pb-choicecard__title">fast</span><span class="pb-choicecard__desc">NVMe, for databases.</span><span class="pb-choicecard__meta">1.2 TB free</span></label>
    <label class="pb-choicecard"><input type="radio" class="pb-radio" name="pool" disabled><span class="pb-icon pb-icon--cloud pb-icon--24"></span><span class="pb-choicecard__title">offsite</span><span class="pb-choicecard__desc">Not configured.</span></label>
  </fieldset>
  <fieldset class="pb-choicecards"><legend class="pb-field__label" style="margin-bottom:10px">Notify on</legend>
    <label class="pb-choicecard"><input type="checkbox" class="pb-check" checked><span class="pb-choicecard__title">Failures</span><span class="pb-choicecard__desc">Backups, checks, certs.</span></label>
    <label class="pb-choicecard"><input type="checkbox" class="pb-check"><span class="pb-choicecard__title">Weekly digest</span><span class="pb-choicecard__desc">Mondays at 09:00.</span></label>
  </fieldset>
</div>
