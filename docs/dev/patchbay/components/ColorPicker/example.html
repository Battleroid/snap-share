<div style="display:grid;gap:20px">
  <div class="pb-field"><span class="pb-field__label" id="lc-l">Label color</span>
    <div class="pb-swatches" role="radiogroup" aria-labelledby="lc-l" data-swatch-group>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--accent)" aria-checked="true" aria-label="Blue"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--pop-red)" aria-checked="false" aria-label="Red"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--pop-yellow)" aria-checked="false" aria-label="Yellow"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--pop-mint)" aria-checked="false" aria-label="Mint"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--ok)" aria-checked="false" aria-label="Green"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--warn)" aria-checked="false" aria-label="Ochre"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--ink)" aria-checked="false" aria-label="Ink"></button>
      <button type="button" role="radio" class="pb-swatch" style="--c:var(--ink-muted)" aria-checked="false" aria-label="Grey"></button>
    </div></div>
  <label class="pb-field" style="max-width:240px"><span class="pb-field__label">Accent for this app</span>
    <span class="pb-input" data-colorfield><button type="button" class="pb-input__swatch" style="--c:#1f3fd6" aria-label="Choose color" aria-haspopup="dialog"></button><input value="#1f3fd6" spellcheck="false" aria-label="Hex color"></span>
    <span class="pb-field__help">Pick a swatch or type a hex value.</span></label>
</div>
