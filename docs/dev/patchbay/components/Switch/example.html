<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Switch</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css"><link rel="stylesheet" href="../../demo.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div class="pb-choices">
  <label class="pb-choice pb-demo-switch-1"><span>Expose to internet<span class="pb-choice__hint">Routes through the reverse proxy.</span></span><input type="checkbox" role="switch" class="pb-switch" checked></label>
  <label class="pb-choice pb-demo-switch-1"><span>Maintenance mode</span><input type="checkbox" role="switch" class="pb-switch"></label>
  <label class="pb-choice pb-demo-switch-1"><span>Auto-update (locked)</span><input type="checkbox" role="switch" class="pb-switch" checked disabled></label>
</div>

</body></html>
