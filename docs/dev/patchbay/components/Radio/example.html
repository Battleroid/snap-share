<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Radio</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css"><link rel="stylesheet" href="../../demo.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<fieldset class="pb-choices">
  <legend class="pb-field__label pb-demo-margin-bottom-12">Retention</legend>
  <label class="pb-choice"><input type="radio" class="pb-radio" name="ret" checked><span>7 days</span></label>
  <label class="pb-choice"><input type="radio" class="pb-radio" name="ret"><span>30 days<span class="pb-choice__hint">Recommended for media.</span></span></label>
  <label class="pb-choice"><input type="radio" class="pb-radio" name="ret"><span>Forever</span></label>
  <label class="pb-choice"><input type="radio" class="pb-radio" name="ret" disabled><span>Cloud tier (not configured)</span></label>
</fieldset>

</body></html>
