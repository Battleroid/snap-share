  <details class="pb-details"><summary>Advanced options<span class="pb-details__meta">3 set</span></summary>

    <details class="pb-details" name="faq" open><summary>Why is the scrub slow?</summary><div class="pb-details__body">Scrubs yield to client I/O. Expect 4–6 hours on a busy pool.</div></details>
