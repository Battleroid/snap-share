<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Card</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css"><link rel="stylesheet" href="../../demo.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div class="pb-demo-display-grid-gap-20">
  <div class="pb-card">
    <div class="pb-card__head"><h3 class="pb-card__title">Snapshot schedule</h3><span class="pb-eyebrow">nightly</span></div>
    <p class="pb-demo-card-1">Runs at 03:00, keeps 30 days. Next run in 6h 12m.</p>
  </div>
  <div class="pb-card">
    <div class="pb-card__band"><span class="pb-icon pb-icon--status-warn pb-icon--16"></span>Certificate expiring</div>
    <p class="pb-demo-card-1"><span class="pb-mono pb-demo-font-size-13">*.lab.home</span> expires in 9 days.</p>
  </div>
  <div class="pb-demo-card-2">
    <a class="pb-card pb-card--outline pb-demo-padding-16" href="#"><div class="pb-eyebrow">media</div><div class="pb-demo-card-3">Jellyfin</div><div class="pb-mono pb-demo-font-size-12-color-ink-muted">media.lab.home</div></a>
    <a class="pb-card pb-card--outline pb-demo-padding-16" href="#" aria-current="true"><div class="pb-eyebrow">files</div><div class="pb-demo-card-3">Seafile</div><div class="pb-mono pb-demo-font-size-12-color-ink-muted">files.lab.home</div></a>
    <div class="pb-card pb-card--outline pb-card--down pb-demo-padding-16"><div class="pb-eyebrow">dns</div><div class="pb-demo-card-3">Pi-hole</div><span class="pb-status" data-status="down"><span class="pb-icon"></span>down</span></div>
    <div class="pb-card pb-card--outline pb-card--ink pb-demo-padding-16"><div class="pb-eyebrow">infra</div><div class="pb-demo-card-3">Proxmox</div><span class="pb-status" data-status="ok"><span class="pb-icon"></span>up</span></div>
  </div>
</div>

</body></html>
