<!DOCTYPE html>
<html lang="en" data-edge="soft" data-theme="light" data-theme-default="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchbay · Loading</title><script src="../../pb-theme-boot.js"></script><link rel="stylesheet" href="../../patchbay.css">
<style>body{margin:0;padding:32px}</style></head>
<body class="pb">
<!-- Set data-edge="hard" on <html> for the hard variant. pb-theme-boot.js picks the theme: the saved choice, else data-theme-default, else the system. -->
<div style="display:grid;gap:20px">
  <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><span class="pb-spinner pb-spinner--sm" role="status" aria-label="Loading"></span><span class="pb-spinner" role="status" aria-label="Loading"></span><span class="pb-spinner pb-spinner--lg" role="status" aria-label="Loading"></span><span class="pb-loading" role="status"><span class="pb-spinner pb-spinner--sm"></span>Checking 12 services…</span></div>
  <div class="pb-card" aria-busy="true" aria-label="Loading service" style="padding:16px"><div style="display:flex;gap:12px;align-items:center"><span class="pb-skel pb-skel--circle" style="width:36px;height:36px"></span><div style="flex:1"><span class="pb-skel pb-skel--title"></span><span class="pb-skel pb-skel--text" style="width:70%"></span></div></div><span class="pb-skel pb-skel--block" style="margin-top:12px;height:72px"></span></div>
  <ul class="pb-list pb-list--compact" aria-busy="true" aria-label="Loading list">
    <li class="pb-item"><span class="pb-skel" style="width:28px;height:28px"></span><span><span class="pb-skel pb-skel--text" style="width:40%"></span><span class="pb-skel pb-skel--text" style="width:65%"></span></span><span class="pb-skel pb-skel--text" style="width:48px"></span></li>
    <li class="pb-item"><span class="pb-skel" style="width:28px;height:28px"></span><span><span class="pb-skel pb-skel--text" style="width:55%"></span><span class="pb-skel pb-skel--text" style="width:35%"></span></span><span class="pb-skel pb-skel--text" style="width:48px"></span></li>
  </ul>
  <div data-demo-load>
    <div class="pb-card" style="padding:16px" data-demo-real hidden><div style="display:flex;gap:12px;align-items:center"><span class="pb-avatar" style="width:36px;height:36px">nc</span><div><b style="display:block;font:500 16px/22px var(--font-serif)">nextcloud</b><span class="pb-mono" style="font-size:12px;color:var(--ink-muted)">nas-01.lan:8080 · up 12 days</span></div></div></div>
    <div class="pb-card" style="padding:16px" data-demo-skel aria-busy="true" aria-label="Loading service"><div style="display:flex;gap:12px;align-items:center"><span class="pb-skel pb-skel--circle" style="width:36px;height:36px"></span><div style="flex:1"><span class="pb-skel pb-skel--title"></span><span class="pb-skel pb-skel--text" style="width:60%"></span></div></div></div>
    <div class="pb-demo-row" style="margin-top:12px"><button type="button" class="pb-btn pb-btn--sm" data-demo-reload><span class="pb-icon pb-icon--refresh"></span>Load again</button><span class="pb-loading" data-demo-status role="status"><span class="pb-spinner pb-spinner--sm"></span>Loading nextcloud…</span></div>
  </div>
</div>
<script>
/* Patchbay core: escaping, CSP-safe styling, delegated document listeners, placement, and the pbInit() hook registry. */
function pbEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
/* Markup built as a string carries styles in data-style; pbStyled moves them into the CSSOM, which a strict style-src allows. */
function pbStyled(c){if(!c||!c.querySelectorAll)return c;var l=[].slice.call(c.querySelectorAll('[data-style]'));if(c.hasAttribute&&c.hasAttribute('data-style'))l.unshift(c);
  l.forEach(function(n){n.style.cssText=n.getAttribute('data-style');n.removeAttribute('data-style');});return c;}
/* data-vars="--w:42%;--c:var(--chart-2)" sets custom properties without a style attribute. */
function pbVars(el){(el.getAttribute('data-vars')||'').split(';').forEach(function(d){var i=d.indexOf(':');if(i<0)return;var k=d.slice(0,i).trim(),v=d.slice(i+1).trim();
  if(!/^--[a-z0-9-]+$/.test(k)||!v||/url\(|expression|[;{}<>]/i.test(v))return;el.style.setProperty(k,v);});}
/* One capturing listener per event type on document (window for resize); entries drop out once their element leaves the page. */
var pbDocL={};
function pbOnDoc(type,el,fn){var L=pbDocL[type];
  if(!L){L=pbDocL[type]=new Set();(type==='resize'?window:document).addEventListener(type,function(e){L.forEach(function(x){
    if(!x.el.isConnected){if(x.seen)L.delete(x);return;}x.seen=true;try{x.fn(e);}catch(err){console.error('[patchbay] '+type,err);}});},true);}
  var x={el:el,fn:fn,seen:el.isConnected};L.add(x);return function(){L.delete(x);};}
function pbPlace(trigger,panel,o){o=o||{};var r=o.rect||trigger.getBoundingClientRect(),w=panel.offsetWidth,h=panel.offsetHeight,g=o.gap==null?8:o.gap;
  var below=r.bottom+g+h<=innerHeight||r.top-g-h<0,y=below?r.bottom+g:r.top-g-h,x=o.align==='end'?r.right-w:(o.align==='center'?r.left+r.width/2-w/2:r.left);
  x=Math.max(8,Math.min(x,innerWidth-w-8));panel.style.left=x+'px';panel.style.top=Math.max(8,y)+'px';panel.dataset.side=below?'bottom':'top';
  panel.style.setProperty('--ax',Math.max(10,Math.min(w-20,r.left+r.width/2-x-5))+'px');}
/* pbHook(name, selector, fn) registers a behavior; pbInit(root, {only, skip}) binds every registered hook under root once per element. */
var pbHooks=[],pbBound=new WeakMap();
function pbHook(name,sel,fn){for(var i=0;i<pbHooks.length;i++)if(pbHooks[i].name===name)return;pbHooks.push({name:name,sel:sel,fn:fn});pbInit.hooks.push(name);}
function pbInit(root,opts){root=root||document;opts=opts||{};
  var list=function(v){return v==null?null:(typeof v==='string'?v.split(/[\s,]+/).filter(Boolean):[].slice.call(v));},only=list(opts.only),skip=list(opts.skip)||[];
  pbHooks.forEach(function(h){if(only&&only.indexOf(h.name)<0||skip.indexOf(h.name)>=0)return;
    var els=[].slice.call(root.querySelectorAll(h.sel));if(root.matches&&root.matches(h.sel))els.unshift(root);
    els.forEach(function(el){if(el.closest('[data-pb-skip~="'+h.name+'"]'))return;var s=pbBound.get(el);if(!s){s=new Set();pbBound.set(el,s);}if(s.has(h.name))return;s.add(h.name);
      try{h.fn(el);}catch(err){console.error('[patchbay] '+h.name,err);}});});
  return root;}
pbInit.hooks=[];
/* pbInit() hooks, bound in this order: pbHook(name, selector, behavior). Skip one with data-pb-skip="name" on an ancestor or pbInit(root, {skip:['name']}). */
pbHook('vars','[data-vars]',pbVars);
document.querySelectorAll('[data-demo-load]').forEach(function(d){var real=d.querySelector('[data-demo-real]'),skel=d.querySelector('[data-demo-skel]'),st=d.querySelector('[data-demo-status]'),btn=d.querySelector('[data-demo-reload]'),t;
  function load(){clearTimeout(t);real.hidden=true;skel.hidden=false;st.hidden=false;btn.disabled=true;t=setTimeout(function(){real.hidden=false;skel.hidden=true;st.hidden=true;btn.disabled=false;},2200);}
  btn.addEventListener('click',load);real.hidden=true;var io=new IntersectionObserver(function(e){if(e[0].isIntersecting){io.disconnect();load();}},{threshold:0.5});io.observe(d);
});
pbInit();
</script>
</body></html>
