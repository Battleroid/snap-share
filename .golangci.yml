version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, usestdlibvars, errcheck]
      - path: internal/(testutil|auth/authtest)/
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
