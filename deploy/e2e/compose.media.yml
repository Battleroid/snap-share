# Override for the isolated e2e stack: ffmpeg runs in a media worker, as with
# deploy/compose.media.yml (make e2e-isolated-media). snap runs as uid 10001
# here, like the worker, so it can use the 0600 socket.
services:
  snap:
    user: "10001:10001"
    environment:
      SNAP_FILES_DIR: /files
      SNAP_MEDIA_WORKER: unix:///run/snap-media/media.sock
      SNAP_MEDIA_WORKER_TOKEN: e2e-media-worker-token-e2e-media-worker-token
    volumes:
      - files:/files
      - media-sock:/run/snap-media
    depends_on:
      media:
        condition: service_healthy

  media:
    image: ${E2E_IMAGE}
    command: ["media-worker"]
    user: "10001:10001"
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=0700,uid=10001,gid=10001"]
    volumes:
      - files:/files:ro
      - media-sock:/run/snap-media
    environment:
      SNAP_MEDIA_WORKER_LISTEN: unix:///run/snap-media/media.sock
      SNAP_MEDIA_WORKER_TOKEN: e2e-media-worker-token-e2e-media-worker-token
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    ulimits:
      core: 0
      nofile: 256
      fsize: 67108864
    healthcheck:
      test: ["CMD", "snap-server", "media-worker", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15

# tmpfs volumes owned by uid 10001, shared by both containers, gone with the stack.
volumes:
  files:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
  media-sock:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=10001,gid=10001,mode=0700"}
