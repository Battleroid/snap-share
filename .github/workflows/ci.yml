# Tests, lint, govulncheck, the Playwright suite and the image build on every pull
# request and every push to main. A v* tag also pushes
# ghcr.io/battleroid/snap-share:<tag> and :latest, once every other job has passed.
# release.yml calls this workflow with the tag it has just made (workflow_call),
# since a tag made with GITHUB_TOKEN does not start a push run of its own.
#
# The jobs call the Makefile, which runs every tool in the pinned container
# (docker/dev.Dockerfile, NODE_IMAGE), so CI and a local checkout use the same
# toolchain; the hosted runner's Docker is all they need. internal/app/docs_test.go
# fails when this file stops calling those targets or an action loses its SHA pin.
#
# The registry login uses the workflow's own GITHUB_TOKEN; no secret is needed.
# The first push creates the package: set its visibility to public under
# Packages > snap-share > Package settings, or `docker pull` needs a login.
#
# Repository settings this relies on:
# - Settings > Actions > General > Actions permissions: "Allow Battleroid, and
#   select non-Battleroid, actions": actions created by GitHub, plus
#   googleapis/release-please-action@*, with "Require actions to be pinned to a
#   full-length commit SHA". "Local actions only" fails every run here at startup
#   with no jobs, so no check is ever reported.
# - Settings > Rules > main: the go, js, e2e, image and title checks are required,
#   so a pull request whose CI never started cannot be merged. Admins can bypass
#   at merge time for release-please's pull request, which is opened with
#   GITHUB_TOKEN and so starts no checks.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) release.yml made on this commit.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The Makefile's CACHE: Go build and module caches, golangci-lint's cache.
          path: ~/.cache/snap
          key: go-${{ hashFiles('go.sum', 'docker/dev.Dockerfile') }}
          restore-keys: go-
      - name: make test-go
        run: make test-go
      - name: make lint
        run: make lint
      - name: make vuln
        run: make vuln

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test-js
        run: make test-js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # npm's cache for test/e2e, under the Makefile's CACHE.
          path: ~/.cache/snap/npm
          key: e2e-npm-${{ hashFiles('test/e2e/package-lock.json') }}
          restore-keys: e2e-npm-
      # Builds the image, starts deploy/e2e/compose.yml (no published ports),
      # runs every spec and tears the stack down.
      - name: make e2e-isolated
        run: make e2e-isolated
      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test/e2e/out/results
          if-no-files-found: ignore
          retention-days: 7

  image:
    needs: [go, js, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushing to ghcr.io on a v* tag
    env:
      # Written out: github.repository has a capital letter, registry names don't.
      IMAGE: ghcr.io/battleroid/snap-share
      # The release tag: release.yml's input, or the pushed v* tag; "" otherwise.
      RELEASE: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: |
          version=${RELEASE:-$(printf '%.12s' "$GITHUB_SHA")}
          docker build --build-arg VERSION="$version" --build-arg COMMIT="$(printf '%.7s' "$GITHUB_SHA")" -t "snap:ci-$GITHUB_SHA" .
          docker run --rm "snap:ci-$GITHUB_SHA" version
      - name: Push to ghcr.io
        if: env.RELEASE != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$RELEASE
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::not a release tag: $tag"; exit 1 ;; esac
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in "$tag" latest; do
            docker tag "snap:ci-$GITHUB_SHA" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          docker logout ghcr.io
