# Pull requests are squash-merged with their title as the commit message, and
# release-please reads those titles for the version bump and CHANGELOG.md, so
# a title must be a Conventional Commit: type(area): what changed.
# docs/dev/conventions.md#commits lists the types.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9/,-]*\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $re ]]; then
            printf '::error title=PR title::"%s" is not type(area): what changed. Types: feat fix perf refactor docs test build ci chore revert; add ! for a breaking change.\n' "$TITLE"
            exit 1
          fi
